server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Giữ nguyên đường dẫn /api/students
        proxy_pass https://mern-backend-237576.onrender.com;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name mern-backend-237576.onrender.com;

        proxy_set_header Host mern-backend-237576.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass https://mern-backend-237576.onrender.com/health;

        proxy_ssl_server_name on;
        proxy_ssl_name mern-backend-237576.onrender.com;
        proxy_set_header Host mern-backend-237576.onrender.com;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}